<!doctype html>

<title>Page Not Found — Kaustubh Suryawanshi</title>

<style>
.error-page{min-height:100svh;display:grid;place-items:center;padding:120px 24px 60px;background:var(--bg,#f5f5f7)}
.error-card{width:min(720px,100%);padding:clamp(32px,6vw,64px);text-align:center;border:1px solid rgba(184,201,222,.62);border-radius:32px;background:rgba(255,255,255,.72);box-shadow:0 24px 70px rgba(31,72,128,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.error-code{margin:0 0 10px;font-size:clamp(72px,15vw,150px);line-height:.9;letter-spacing:-.07em;color:#1769df;font-weight:800}.error-card h1{margin:0 0 14px;font-size:clamp(30px,5vw,52px);letter-spacing:-.05em;color:#142038}.error-card p{margin:0 auto 28px;max-width:560px;color:#627089;line-height:1.7}.error-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.error-actions a,.error-actions button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:14px;text-decoration:none}.error-home{background:#1769df;color:#fff}.error-back{border:1px solid #d6e0ed;color:#24344e;background:rgba(255,255,255,.8)}
html[data-theme="dark"] .error-page{background:#070d15}.dark .error-card{background:rgba(13,24,38,.88);border-color:rgba(105,139,177,.35)}
html[data-theme="dark"] .error-card{background:rgba(13,24,38,.88);border-color:rgba(105,139,177,.35)}
html[data-theme="dark"] .error-card h1{color:#eef4ff}html[data-theme="dark"] .error-card p{color:#9aaac0}html[data-theme="dark"] .error-back{background:rgba(13,24,38,.8);border-color:rgba(105,139,177,.4);color:#e6eef9}
@media(max-width:560px){.error-page{padding-inline:16px}.error-card{border-radius:24px}.error-actions{flex-direction:column}.error-actions a{width:100%}}
</style>
</head>
<body>
<main class="error-page">
<section class="error-card" aria-labelledby="error-title">
<p class="error-code" aria-hidden="true">404</p>
<h1 id="error-title">This page went off the map.</h1>
<p>The page you requested doesn't exist or may have moved. Head back to the portfolio and continue exploring the work.</p>
<div class="error-actions"><a class="error-home" href="index.html">Back to Home →</a><button class="error-back" id="error-back" type="button">Go Back</button></div>
</section>
</main>
<script src="app.js?v=133" defer></script>
<script>document.getElementById("error-back")?.addEventListener("click",()=>{if(history.length>1)history.back();else location.href="index.html"})</script>
</body>
</html>
